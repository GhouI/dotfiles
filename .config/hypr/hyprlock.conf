source = ~/.config/hypr/mocha.conf

general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Profile picture (~/.face)
image {
    path = ~/.face
    size = 120
    rounding = -1
    border_size = 3
    border_color = $mauve
    position = 0, 300
    halign = center
    valign = center
}

# Time
label {
    text = $TIME
    color = $text
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext0
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    outline_thickness = 3
    rounding = 16
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    check_color = $peach
    fail_color = $red
    fail_text = <i>wrong password</i>
    placeholder_text = <span foreground="##a6adc8">  $USER</span>
    dots_center = true
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}

# Now playing
label {
    text = cmd[update:1000] playerctl metadata --format '  {{ artist }} — {{ title }}' 2>/dev/null
    color = $pink
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = bottom
}
