# Hyprland — Crimson rice
# Wiki: https://wiki.hypr.land

source = ~/.config/hypr/colors.conf

# ── Monitors ──────────────────────────────────────────────
monitor = HDMI-A-2, 1920x1080@60, 0x0, 1
monitor = DP-2, highrr, 1920x0, 1
monitor = , preferred, auto, 1

# ── Programs ──────────────────────────────────────────────
$terminal = ghostty
$files    = nautilus
$menu     = rofi -show drun
$mainMod  = SUPER

# ── Autostart ─────────────────────────────────────────────
exec-once = waybar
exec-once = [ -e ~/.cache/current-wallpaper ] && hyprpaper || ~/.config/hypr/scripts/wallpaper.sh
exec-once = mako
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator
exec-once = blueman-applet

# ── Environment ───────────────────────────────────────────
env = XCURSOR_THEME,catppuccin-mocha-red-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,catppuccin-mocha-red-cursors
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ── Look & feel ───────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = $mauve $pink 45deg
    col.inactive_border = $surface0
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.17
        popups = true
    }

    shadow {
        enabled = true
        range = 24
        render_power = 2
        color = rgba(e3122e55)
        color_inactive = rgba(060000aa)
    }
}

animations {
    enabled = true

    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 5, overshot, popin 80%
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 60, linear, loop
    animation = fade, 1, 5, smooth
    animation = workspaces, 1, 5, smooth, slide
    animation = layers, 1, 4, smooth, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = $crust
}

# ── Input ─────────────────────────────────────────────────
input {
    kb_layout = gb
    follow_mouse = 1
    sensitivity = 0
}

# ── Keybinds ──────────────────────────────────────────────
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space, exec, $menu
bind = $mainMod, E, exec, $files
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, T, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, E, exec, wlogout -b 5 -T 350 -B 350
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p clipboard | cliphist decode | wl-copy
bind = $mainMod SHIFT, R, exec, killall waybar; waybar &
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh

# Screenshots: region to clipboard / full screen to ~/Pictures/Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Drag to move / right-drag to resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ── Window & layer rules ─────────────────────────────────
windowrule = float on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = suppress_event maximize, match:class .*

layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace rofi
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.3, match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace rofi
layerrule = ignore_alpha 0.3, match:namespace notifications
